          });
        }
        if (!selection) {
          showToast('Completaste este curso');
          return;
        }
        if (selection.kind === 'resume') {
          selectLessonRun(selection.runId);
          return;
        }

        await startLearningRun(selection, now);
      } catch (error) {
        if (error.code !== 'LEARNING_CONFLICT') showToast(`No se pudo iniciar la lección: ${error.message}`);
      }
    }

    function renderLessonControls() {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
      if (!run) {
        lessonControls.hidden = true;
        lessonForkBtn.hidden = true;
        sendBtn.hidden = false;
        if (!currentLessonRunId) chatInput.disabled = false;
        updateLessonTutorVisibility();
        updateSendBtn();
        return;
      }
      const pendingAttempt = pendingLessonAttempt(run);
      const pending = Boolean(pendingAttempt);
      const complete = run.status !== 'in_progress';
      const resolvedLesson = isResolvedLessonRun(run);
      lessonForkBtn.hidden = run.status !== 'in_progress' && !resolvedLesson;
      sendBtn.hidden = resolvedLesson;
      const bestAttemptScore = Math.max(0, ...run.attempts.map(attempt =>
        Number.isFinite(attempt.evaluation?.score) ? attempt.evaluation.score : 0
      ));
      const solutionEnabled = !pending && !isLoading && !isLearningSaving
        && (run.status === 'in_progress' || resolvedLesson)
        && bestAttemptScore >= SOLUTION_UNLOCK_SCORE && !run.solutionViewed;
      const score = lessonRunScore(run);
      const projectFiles = learningContent.lessonModality(findLesson(run.lessonId))
        === learningContent.LESSON_MODALITIES.PROJECT_FILES;
      lessonControls.hidden = false;
      lessonControls.innerHTML = `
        <div class="lesson-control-meta">
          <span>${escapeHtml(run.kind === 'review' ? 'Repaso' : run.kind === 'checkpoint' ? 'Checkpoint' : 'Lección')}</span>
          <strong>${escapeHtml(lessonRunStatusLabel(run.status))}</strong>
          <span>${escapeHtml(run.attempts.length)} intento${run.attempts.length === 1 ? '' : 's'}${score === null ? '' : ` · ${escapeHtml(score)}/100`}</span>
        </div>
        <div class="lesson-control-actions">
          ${pendingAttempt
            ? `<button type="button" data-lesson-control="retry-evaluation"
                ${isLoading || isLearningSaving ? 'disabled' : ''}>Reintentar evaluación</button>`
            : ''}
          ${run.solutionViewed ? '' : `
            <button type="button" data-lesson-control="solution" ${solutionEnabled ? '' : 'disabled'}>
              ${bestAttemptScore >= SOLUTION_UNLOCK_SCORE ? 'Ver solución' : 'Solución'}
            </button>
          `}
          ${resolvedLesson && run.kind !== 'review'
            ? '<button type="button" data-lesson-control="retry">Intentar de nuevo</button>'
            : ''}
          ${complete ? '<button class="lesson-next" type="button" data-lesson-control="next">Siguiente lección</button>' : ''}
        </div>
      `;
      chatInput.disabled = pending || isLoading || isLearningSaving
        || (run.status !== 'in_progress' && !resolvedLesson);
      chatInput.placeholder = resolvedLesson
        ? 'Pregunta sobre esta lección...'
        : pending
          ? 'La evaluación está pendiente...'
          : run.status === 'in_progress'
            ? projectFiles
              ? 'Pega los archivos completos en el orden indicado...'
              : 'Pega aquí tu respuesta...'
            : 'Repaso completado';
      updateLessonTutorVisibility();
      updateSendBtn();
    }

    function renderLearningState() {
      renderLearningDashboard();
      if (promptCategories.length) renderPromptTree(promptCategories);
      if (currentLessonRunId) {
        const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
        if (run) {
          messages = lessonRunMessages(run);
          renderMessages();
        } else {
          leaveLessonMode();
          messages = [];
          currentConversationId = null;
          clearMessagesUI();
          setConversationUrl(null, true);
        }
      }
      renderLessonControls();
      renderConversations(conversationSearch.value.trim());
      updateSendBtn();
    }

    async function revealCurrentSolution() {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
      const bestAttemptScore = Math.max(0, ...(run?.attempts || []).map(attempt =>
        Number.isFinite(attempt.evaluation?.score) ? attempt.evaluation.score : 0
      ));
      if (!run || bestAttemptScore < SOLUTION_UNLOCK_SCORE || run.solutionViewed || isLearningSaving || isLoading) return;
      try {
        const session = resolveLessonSession(run);
        const solution = session.solution;
        const explanation = markdownItems(session.lessonSupport.explanationPoints);
        let content;
        if (session.modality === learningContent.LESSON_MODALITIES.PROJECT_FILES) {
          content = [
            '## Solución de referencia',
            '',
            learningContent.projectFilesMarkdown(solution.files, 3),
            '',
            '### Verificación en el navegador',
            markdownItems(session.expectedBrowserResult || solution.verification),
            '',
            '### Puntos de explicación',
            explanation,
          ].join('\n');
        } else {
          const output = Array.isArray(solution.referenceOutput)
            ? solution.referenceOutput.join('\n')
            : String(solution.referenceOutput || '');
          content = [
            '## Solución de referencia',
            '',
            '```js',
            solution.executableCode,
            '```',
            '',
            '### Salida',
            '```text',
            output,
            '```',
            '',
            '### Puntos de explicación',
            explanation,
          ].join('\n');
        }
        const now = new Date();
        let nextState = learningEngine.revealSolution(learningState, run.id, { now });
        nextState = learningEngine.appendLessonMessage(nextState, run.id, {
          id: newLearningId(),
          timestamp: now,
          type: 'solution',
          role: 'assistant',
          content,
        });
        await commitLearningState(nextState);
      } catch (error) {
        if (error.code !== 'LEARNING_CONFLICT') showToast(`No se pudo mostrar la solución: ${error.message}`);
      }
    }

    lessonControls.addEventListener('click', event => {
      const button = event.target.closest('[data-lesson-control]');
      if (!button || button.disabled) return;
      if (button.dataset.lessonControl === 'solution') revealCurrentSolution();
      if (button.dataset.lessonControl === 'retry-evaluation') retryLessonEvaluation();
      if (button.dataset.lessonControl === 'retry') {
        const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
        if (run) retryLearningLesson(run.lessonId);
      }
      if (button.dataset.lessonControl === 'next') startLearningSelection(false);
    });

    learningDashboard.addEventListener('click', event => {
      const lesson = event.target.closest('[data-learning-lesson]');
      if (lesson && !lesson.disabled) openLearningLesson(lesson.dataset.learningLesson);
    });

    function evaluationContextFor(run, submission) {
      const session = resolveLessonSession(run);
      const projectFiles = session.modality === learningContent.LESSON_MODALITIES.PROJECT_FILES;
      return {
        lessonId: session.lesson.id,
        title: session.lesson.title,
        type: session.lesson.lessonType.includes('checkpoint') ? 'checkpoint' : 'lesson',
        modality: session.modality,
        skills: session.lesson.primarySkills,
        task: session.task,
        dataset: session.datasetContext,
        runtime: session.runtime,
        workspace: projectFiles ? session.workspace : null,
        submissionFiles: projectFiles ? session.submissionFiles : [],
        expectedBrowserResult: projectFiles ? session.expectedBrowserResult : [],
        acceptanceCriteria: projectFiles
          ? session.lesson.acceptanceCriteria
          : codeObservableAcceptanceCriteria(session.lesson),
        rubric: session.lesson.rubric || [
          { id: 'resultado', criterion: 'El código produce el resultado solicitado.', points: 60 },
          { id: 'requisitos', criterion: 'Cumple los criterios y comprobaciones críticas.', points: 30 },
          { id: 'claridad', criterion: 'El código es legible y directo.', points: 10 },
        ],
        criticalChecks: projectFiles
          ? session.lesson.criticalChecks
          : codeObservableCriticalChecks(session.lesson),
        reference: session.reference,
        submission,
      };
    }

    async function callLessonEvaluator(run, submission) {
      const data = await requestChat({
        intent: 'lesson_evaluate',
        provider: selectedModel.provider,
        model: selectedModel.id,
        evaluationContext: evaluationContextFor(run, submission),
      });
      if (!data.evaluation) throw new Error('La respuesta no incluyó una evaluación');
      return data.evaluation;
    }

    async function recordLessonEvaluationError(runId, attemptId, error) {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === runId);
      const attempt = run?.attempts?.find(candidate => candidate.id === attemptId);
      if (!run || attempt?.status !== 'evaluation_pending') return;
      const feedback = `No se pudo evaluar: ${error.message}`;
      const nextState = learningEngine.recordEvaluation(learningState, runId, attemptId, {
        verdict: 'evaluation_error',
        feedback,
      }, {
        messageId: newLearningId(),
        now: new Date(),
      });
      await commitLearningState(nextState);
    }

    async function applyAndSaveLessonEvaluation(runId, attemptId, evaluation) {
      const currentRun = learningState?.lessonRuns?.find(candidate => candidate.id === runId);
      if (!currentRun) throw new Error('La sesión pendiente ya no existe');
      const evaluatedState = learningEngine.recordEvaluation(
        learningState,
        runId,
        attemptId,
        evaluation,
        { messageId: newLearningId(), now: new Date() },
      );
      const retainedRun = bestCompletedLessonRun(currentRun.lessonId, evaluatedState);
      const currentRunRetained = evaluatedState.lessonRuns.some(candidate => candidate.id === runId);
      await commitLearningState(evaluatedState);
      if (!currentRunRetained && retainedRun) {
        showToast('El reintento no mejoró tu mejor sesión; se conserva la anterior');
        selectLessonRun(retainedRun.id);
      }
    }

    async function evaluatePendingLessonAttempt(runId, attemptId) {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === runId);
      const attempt = run?.attempts?.find(candidate => candidate.id === attemptId);
      if (!run || attempt?.status !== 'evaluation_pending' || isLoading || isLearningSaving || !selectedModel) return;

      const submission = attempt.submission;
      isLoading = true;
      renderLessonControls();
      updateSendBtn();
      const typing = appendTyping();
      let evaluation;
      try {
        evaluation = await callLessonEvaluator(run, submission);
      } catch (error) {
        typing.remove();
        try {
          await recordLessonEvaluationError(runId, attemptId, error);
        } catch (saveError) {
          if (saveError.code !== 'LEARNING_CONFLICT') {
            showToast(`No se pudo guardar el error de evaluación: ${saveError.message}`);
          }
        }
        showToast(`No se pudo evaluar: ${error.message}`);
        return;
      } finally {
        if (!evaluation) {
          isLoading = false;
          renderLearningState();
        }
      }

      typing.remove();
      try {
        await applyAndSaveLessonEvaluation(runId, attemptId, evaluation);
      } catch (error) {
        if (error.code !== 'LEARNING_CONFLICT') {
          showToast(`No se pudo guardar la evaluación: ${error.message}`);
        }
      } finally {
        isLoading = false;
        renderLearningState();
      }
    }

    async function retryLessonEvaluation() {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
      const attempt = pendingLessonAttempt(run);
      if (run && attempt) await evaluatePendingLessonAttempt(run.id, attempt.id);
    }

    async function handleLessonAttempt() {
      const submission = chatInput.value.trim();
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
      if (!submission || !run || run.status !== 'in_progress' || pendingLessonAttempt(run)
          || isLoading || isLearningSaving || !selectedModel) return;
      if (attachedImages.length) {
        attachedImages = [];
        renderImagePreview();
        showToast('Las lecciones solo aceptan texto');
        return;
      }

      const runId = run.id;
      const attemptId = newLearningId();
      try {
        const attemptedState = learningEngine.submitAttempt(learningState, runId, submission, {
          id: attemptId,
          messageId: newLearningId(),
          now: new Date(),
        });
        await commitLearningState(attemptedState);
      } catch (error) {
        if (error.code !== 'LEARNING_CONFLICT') showToast(`No se pudo guardar el intento: ${error.message}`);
        return;
      }

      chatInput.value = '';
      chatInput.style.height = 'auto';
      charCounter.textContent = '';
      await evaluatePendingLessonAttempt(runId, attemptId);
    }

    async function forkCompletedLesson(question) {
      const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
      if (!question || (!isResolvedLessonRun(run) && run?.status !== 'in_progress')
          || isLoading || isLearningSaving || !selectedModel) return;

      const now = new Date().toISOString();
      const fork = {
        id: generateId(),
        title: `Fork · ${run.lessonSnapshot?.title || findLesson(run.lessonId).title}`,
        harness: 'normal',
        messages: (run.messages || [])
          .filter(message => FORK_LESSON_MESSAGE_TYPES.has(message.type))
          .map(({ role, content, type }) => ({ role, content, type })),
        created_at: now,
        updated_at: now,
      };
      conversations.unshift(fork);
      saveToLocalStorage();
      isLoading = true;
      renderLessonControls();
      try {
        await syncToNeon(fork, 'upsert');
      } finally {
        isLoading = false;
      }

      leaveLessonMode();
      selectedHarness = 'normal';
      currentConversationId = fork.id;
      setConversationUrl(fork.id);
      messages = fork.messages;
      updateKataToggle();
      renderMessages();
      renderConversations(conversationSearch.value.trim());
      chatInput.value = question;
      chatInput.dispatchEvent(new Event('input'));
      await handleSend();
    }

    async function forkConversation() {
      const conversation = conversations.find(item => item.id === currentConversationId);
      if (!conversation || selectedHarness !== 'normal' || messages.length === 0 || isLoading) return;

      const now = new Date().toISOString();
      const fork = {
        id: generateId(),
        title: `Fork · ${conversation.title || 'Conversación'}`,
        harness: 'normal',
        messages: structuredClone(messages),
        created_at: now,
        updated_at: now,
      };
      conversations.unshift(fork);
      saveToLocalStorage();
      await syncToNeon(fork, 'upsert');
      currentConversationId = fork.id;
      setConversationUrl(fork.id);
      messages = fork.messages;
      renderMessages();
      renderConversations(conversationSearch.value.trim());
      updateSendBtn();
    }

    // Chat
    sendBtn.addEventListener('click', handleSend);
    lessonForkBtn.addEventListener('click', () => {
      if (currentLessonRunId) forkCompletedLesson(chatInput.value.trim());
      else forkConversation();
    });

    function undoLastTurn() {
      if (!currentConversationId || isLoading) return;
      const userIndex = messages.findLastIndex(message => message.role === 'user');
      if (userIndex < 0) return;
      const removedTurn = messages.splice(userIndex);
      const history = undoneTurns.get(currentConversationId) || [];
      history.push(removedTurn);
      undoneTurns.set(currentConversationId, history);
      const conversation = conversations.find(item => item.id === currentConversationId);
      if (conversation) {
        updateConversation(conversation.id, messages.length ? conversation.title : 'Nueva conversación', messages);
      }
      chatInput.value = '';
      chatInput.dispatchEvent(new Event('input'));
      renderMessages();
      renderConversations(conversationSearch.value.trim());
      updateKataToggle();
    }

    function redoLastTurn() {
      if (!currentConversationId || isLoading) return;
      const history = undoneTurns.get(currentConversationId);
      const restoredTurn = history?.pop();
      if (!restoredTurn) return;
      messages.push(...restoredTurn);
      if (history.length === 0) undoneTurns.delete(currentConversationId);
      const conversation = conversations.find(item => item.id === currentConversationId);
      if (conversation) {
        const firstUserMessage = messages.find(message => message.role === 'user');
        const title = conversation.title === 'Nueva conversación' && firstUserMessage
          ? firstUserMessage.content.substring(0, 50) + (firstUserMessage.content.length >= 50 ? '…' : '')
          : conversation.title;
        updateConversation(conversation.id, title, messages);
      }
      chatInput.value = '';
      chatInput.dispatchEvent(new Event('input'));
      renderMessages();
      renderConversations(conversationSearch.value.trim());
      updateKataToggle();
    }

    async function handleSend() {
      if (currentLessonRunId) {
        const run = learningState?.lessonRuns?.find(candidate => candidate.id === currentLessonRunId);
        if (isResolvedLessonRun(run)) {
          await forkCompletedLesson(chatInput.value.trim());
        } else if (run?.status === 'in_progress') {
          await handleLessonAttempt();
        }
        return;
      }
      const text = chatInput.value.trim();
      const images = attachedImages;
      if (text.toLowerCase() === '/undo') {
        undoLastTurn();
        return;
      }
      if (text.toLowerCase() === '/redo') {
        redoLastTurn();
        return;
      }
      if ((!text && images.length === 0) || isLoading || !selectedModel) return;

      if (!currentConversationId) {
        createConversation();
      }

      emptyState.style.display = 'none';
      const userText = text || '[Imagen adjunta]';
      undoneTurns.delete(currentConversationId);
      messages.push({ role: 'user', content: userText, imageCount: images.length, harness: selectedHarness });
      appendMessage('user', images.length ? `${userText}\n\n[${images.length} imagen${images.length > 1 ? 'es' : ''} adjunta${images.length > 1 ? 's' : ''}]` : userText);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      attachedImages = [];
      renderImagePreview();
      charCounter.textContent = '';
      isLoading = true;
      updateSendBtn();
      updateKataToggle();

      const typing = appendTyping();
      try {
        const messageModel = selectedModel;
        const result = await callProvider(selectedModel.provider, selectedModel.id, messages, images);
        const reply = result.content;
        typing.remove();
        messages.push({ role: 'assistant', content: reply, model: messageModel });
        appendMessage('assistant', reply, messageModel);

        const conv = conversations.find(c => c.id === currentConversationId);
        if (conv) {
          if (!conv.title || conv.title === 'Nueva conversación') {
            const title = messages[0]?.content?.substring(0, 50) || 'Nueva conversación';
            conv.title = title + (title.length >= 50 ? '…' : '');
          }
          updateConversation(currentConversationId, conv.title, messages);
          renderConversations(conversationSearch.value.trim());
        }
      } catch (err) {
        typing.remove();
        showToast(` ${err.message}`);
        messages.pop();
        appendMessage('assistant', `**Error:** ${err.message}`, selectedModel);
      } finally {
        isLoading = false;
        updateSendBtn();
        updateKataToggle();
      }
    }

    async function callProvider(provider, model, msgs, images) {
      return requestChat({
        messages: msgs.map(({ role, content }) => ({ role, content })),
        images,
        provider,
        model,
        harness: selectedHarness
      });
    }

    // Renderizado de respuestas
    function appendMessage(role, content, model, type) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      if (type) wrap.dataset.messageType = type;
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      const lessonLabel = ({
        challenge: 'Curso · Reto',
        attempt: 'Tu intento',
        evaluation: 'Evaluación',
        evaluation_error: 'Error de evaluación',
        solution: 'Curso · Solución',
      })[type];
      if (lessonLabel) {
        meta.textContent = lessonLabel;
      } else if (role === 'assistant' && model) {
        const p = PROVIDERS.find(pp => pp.id === model.provider);
        meta.innerHTML = p
          ? `<span style="color:${p.color}">●</span> ${escapeHtml(p.name)} · ${escapeHtml(model.label)}`
          : `Asistente · ${escapeHtml(model.label || model.id || 'Modelo')}`;
      } else if (role === 'assistant') {
        meta.textContent = 'Asistente';
      } else {
        meta.textContent = 'Tú';
      }
      const copyBtn = document.createElement('button');
      copyBtn.className = 'msg-copy-btn';
      copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
      copyBtn.onclick = () => copyMessage(copyBtn, content);
      copyBtn.title = 'Copiar';
      meta.appendChild(copyBtn);
      const bubble = document.createElement('div');
      bubble.className = role === 'assistant' ? 'msg-content' : 'msg-bubble';
      if (role === 'assistant') {
        const md = document.createElement('div');
        md.className = 'md-content';
        md.innerHTML = marked.parse(formatThinkingBlocks(content));
        bubble.appendChild(md);

        const topBtn = document.createElement('button');
        topBtn.className = 'response-top-btn';
        topBtn.type = 'button';
        topBtn.title = 'Ir al inicio de esta respuesta';
        topBtn.setAttribute('aria-label', 'Ir al inicio de esta respuesta');
        topBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
        topBtn.onclick = () => wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
        bubble.appendChild(topBtn);
      } else {
        bubble.textContent = content;
      }
      wrap.appendChild(meta);
      wrap.appendChild(bubble);
      messagesWrap.appendChild(wrap);
      messagesWrap.scrollTop = messagesWrap.scrollHeight;
    }

    function formatThinkingBlocks(content) {
      const text = decodeMaybeJsonString(content);
      return text.replace(/<think>([\s\S]*?)<\/think>/gi, (_, think) => {
        const safeThink = think.trim().replace(/<\/summary>/gi, '<\\/summary>');
        return `<details class="think-details"><summary>Inferencia extendida</summary>\n\n${safeThink}\n\n</details>`;
      });
    }

    function decodeMaybeJsonString(content) {
      const text = String(content || '').trim();
      if (!text.startsWith('"') || !text.endsWith('"')) return text;

      try {
        const parsed = JSON.parse(text);
        return typeof parsed === 'string' ? parsed : text;
      } catch {
        return text;
      }
    }

    function copyMessage(btn, content) {
      navigator.clipboard.writeText(content).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        }, 2000);
      });
    }

    function formatConversationForCopy() {
      return messages.map(msg => {
        const author = msg.role === 'user' ? 'Tú' : 'Asistente';
        const model = msg.role === 'assistant' && msg.model?.label ? ` (${msg.model.label})` : '';
        const imageNote = msg.role === 'user' && msg.imageCount
          ? `\n[${msg.imageCount} imagen${msg.imageCount > 1 ? 'es' : ''} adjunta${msg.imageCount > 1 ? 's' : ''}]`
          : '';
        return `${author}${model}:\n${msg.content}${imageNote}`;
      }).join('\n\n---\n\n');
    }

    function copyConversation(btn) {
      if (!messages.length) {
        showToast('No hay conversación para copiar');
        return;
      }

      navigator.clipboard.writeText(formatConversationForCopy()).then(() => {
        const original = btn.innerHTML;
        btn.classList.add('active');
        btn.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
        showToast('Conversación copiada');
        setTimeout(() => {
          btn.classList.remove('active');
          btn.innerHTML = original;
        }, 2000);
      });
    }

    function appendTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg assistant';
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (selectedModel) {
        const p = PROVIDERS.find(pp => pp.id === selectedModel.provider);
        meta.innerHTML = p
          ? `<span style="color:${p.color}">●</span> ${escapeHtml(p.name)} · ${escapeHtml(selectedModel.label)}`
          : `Evaluando · ${escapeHtml(selectedModel.label || selectedModel.id || 'Modelo')}`;
      }
      const ind = document.createElement('div');
      ind.className = 'typing-indicator';
      ind.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      wrap.appendChild(meta);
      wrap.appendChild(ind);
      messagesWrap.appendChild(wrap);
      messagesWrap.scrollTop = messagesWrap.scrollHeight;
      return wrap;
    }

    // Tema
    const themeBtn = document.getElementById('themeBtn');
    const hljsDark = document.getElementById('hljs-dark');
    const hljsLight = document.getElementById('hljs-light');

    themeBtn.addEventListener('click', () => {
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      const applyTheme = () => {
        currentTheme = nextTheme;
        document.documentElement.setAttribute('data-theme', currentTheme);
        hljsDark.disabled = currentTheme !== 'dark';
        hljsLight.disabled = currentTheme !== 'light';
      };

      if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        applyTheme();
        return;
      }

      const viewportWidth = window.visualViewport?.width ?? window.innerWidth;
      const viewportHeight = window.visualViewport?.height ?? window.innerHeight;
      const { top, left, width, height } = themeBtn.getBoundingClientRect();
      const x = left + width / 2;
      const y = top + height / 2;
      const maxRadius = Math.hypot(
        Math.max(x, viewportWidth - x),
        Math.max(y, viewportHeight - y)
      );
      const clipPath = getThemeClipPaths(x, y, maxRadius);
      const root = document.documentElement;

      root.dataset.themeVt = 'active';
      root.style.setProperty('--theme-vt-duration', '500ms');
      root.style.setProperty('--theme-vt-clip-from', clipPath[0]);

      const transition = document.startViewTransition(applyTheme);
      transition.finished.finally(() => {
        delete root.dataset.themeVt;
        root.style.removeProperty('--theme-vt-duration');
        root.style.removeProperty('--theme-vt-clip-from');
      });

      transition.ready.then(() => {
        document.documentElement.animate({
          clipPath
        }, {
          duration: 500,
          easing: 'ease-in-out',
          fill: 'forwards',
          pseudoElement: '::view-transition-new(root)'
        });
      });

    });

    function getThemeClipPaths(cx, cy, maxRadius) {
      return [
        `circle(0px at ${cx}px ${cy}px)`,
        `circle(${maxRadius}px at ${cx}px ${cy}px)`
      ];
    }

    let toastTimer;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 5000);
    }

    // Eventos globales e inicio
    drawerBtn.addEventListener('click', toggleDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    copyConversationBtn.addEventListener('click', () => copyConversation(copyConversationBtn));
    cancelDeleteBtn.addEventListener('click', closeDeleteDialog);
    deleteConfirmOverlay.addEventListener('click', (e) => {
      if (e.target === deleteConfirmOverlay) closeDeleteDialog();
    });
    confirmDeleteBtn.addEventListener('click', () => {
      if (!pendingDeleteId) return;
      const id = pendingDeleteId;
      deleteConfirmOverlay.classList.remove('open');
      deleteConfirmOverlay.setAttribute('aria-hidden', 'true');
      pendingDeleteId = null;
      deleteConversation(id);
      setTimeout(focusKeyboardConversation, 0);
    });
    newChatBtn.addEventListener('click', () => {
      startNewConversation();
      closeDrawer();
    });
    conversationSearch.addEventListener('input', () => renderConversations(conversationSearch.value.trim()));
    document.addEventListener('keydown', (e) => {
      if (deleteConfirmOverlay.classList.contains('open')) {
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmDeleteBtn.click();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeDeleteDialog();
        }
        return;
      }

      if (e.key === 'Escape' && !lessonTutorPanel.hidden) {
        e.preventDefault();
        closeLessonTutor();
        lessonTutorBtn.focus({ preventScroll: true });
        return;
      }

      if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey
          && !currentLessonRunId && messages.length === 0 && !chatInput.value && !drawer.classList.contains('open')
          && !modelDropdown.classList.contains('open')) {
        const chip = promptTree.querySelector(`[data-prompt][data-shortcut="${e.key}"]`);
        if (chip) {
          e.preventDefault();
          writePrompt(chip);
        }
        return;
      }

      const isConversationSearch = e.target === conversationSearch;
      const isEditingTitle = e.target.matches('[contenteditable="true"]');
      const isConversationAction = e.target.classList.contains('conv-action-btn');

      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'o') {
        e.preventDefault();
        startNewConversation();
        closeDrawer();
        return;
      }

      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        toggleDrawer();
        return;
      }

      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (modelDropdown.classList.contains('open')) {
          closeDropdown();
        } else {
          openDropdown();
        }
        return;
      }

      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        copyConversation(copyConversationBtn);
        return;
      }

      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        themeBtn.click();
        return;
      }

      if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        if (!lessonTutorBtn.hidden || !lessonTutorPanel.hidden) lessonTutorBtn.click();
        return;
      }

      if (e.ctrlKey && e.altKey && e.key === 'Enter') {
        e.preventDefault();
        if (chatInput.value.trim()) handleSend();
        return;
      }

      if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        selectHarness(selectedHarness === 'kata' ? 'normal' : 'kata');
        return;
      }

      if (!drawer.classList.contains('open') || isConversationSearch || isEditingTitle
          || (e.key === 'Enter' && isConversationAction)) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        navigateConversations(1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        navigateConversations(-1);
      } else if (e.key === 'ArrowRight' && keyboardConversationIndex >= 0) {
        e.preventDefault();
        focusConversationAction('delete');
      } else if (e.key === 'ArrowLeft' && keyboardConversationAction === 'delete') {
        e.preventDefault();
        focusConversationAction('edit');
      } else if (e.key === 'ArrowLeft' && keyboardConversationAction === 'edit') {
        e.preventDefault();
        focusKeyboardConversation();
      } else if (e.key === 'Enter' && keyboardConversationIndex >= 0) {
        const item = drawerList.querySelectorAll('.conversation-item')[keyboardConversationIndex];
        if (item) selectConversation(item.dataset.id);
      } else if (e.key === 'Escape') {
        closeDrawer();
      }
    });
    window.addEventListener('popstate', loadConversationFromUrl);

    updateModelDisplay();
    buildDropdown();
    loadModels();
    updateSendBtn();
    updateKataToggle();
    syncLessonTutorOffset();
    // initVisualHome(); // Dynamic rain desactivada temporalmente.
    focusChatInput();

    if (window.lucide) {
      lucide.createIcons();
      updateModelDisplay();
    }

    async function bootstrap() {
      try {
        await initDB();
        loadConversationFromUrl();
      } finally {
        initialLoading.classList.add('hidden');
      }
    }

    bootstrap();
  </script>
  <script type="module">
    import React, { useEffect, useRef, useState } from 'https://esm.sh/react@19';
    import { createRoot } from 'https://esm.sh/react-dom@19/client';
    import { MeshGradient } from 'https://esm.sh/@paper-design/shaders-react?deps=react@19';

    const h = React.createElement;
    function AnimatedMeshCharacter() {
      const svgRef = useRef(null);
      const [eyeOffset, setEyeOffset] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const trackPointer = (event) => {
          const rect = svgRef.current?.getBoundingClientRect();
          if (!rect) return;
          const x = Math.max(-8, Math.min(8, (event.clientX - rect.left - rect.width / 2) * .08));
          const y = Math.max(-8, Math.min(8, (event.clientY - rect.top - rect.height / 2) * .08));
          setEyeOffset({ x, y });
        };
        window.addEventListener('pointermove', trackPointer);
        return () => window.removeEventListener('pointermove', trackPointer);
      }, []);

      return h('div', { className: 'mesh-character' },
        h('div', { className: 'mesh-surface', 'aria-hidden': true },
          h(MeshGradient, {
            colors: ['#FFB3D9', '#87CEEB', '#4A90E2', '#2C3E50', '#1A1A2E'],
            speed: 1,
            style: { width: '100%', height: '100%' }
          })
        ),
        h('svg', { ref: svgRef, viewBox: '0 0 231 289', xmlns: 'http://www.w3.org/2000/svg' },
          h('ellipse', { className: 'mesh-eye', cx: 80 + eyeOffset.x, cy: 120 + eyeOffset.y, rx: 20, ry: 30 }),
          h('ellipse', { className: 'mesh-eye', cx: 150 + eyeOffset.x, cy: 120 + eyeOffset.y, rx: 20, ry: 30 })
        )
      );
    }

    createRoot(document.getElementById('meshCharacter')).render(h(AnimatedMeshCharacter));
  </script>
</body>
